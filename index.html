<html><head><base href="." /><title>Monsters Inc. Door Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #2c3e50;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  .game-container {
    flex: 1;
    position: relative;
  }

  .door {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(200px, 60vw);
    height: min(300px, 70vh);
    background: #e74c3c;
    border-radius: 10px;
    transition: all 0.3s;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
  }

  .door.locked {
    background: #c0392b;
  }

  .door.closed {
    transform: translate(-50%, -50%) scaleX(0.1);
    opacity: 0.8;
  }

  .knob {
    width: min(30px, 10vw);
    height: min(30px, 10vw);
    background: #f1c40f;
    border-radius: 50%;
    position: absolute;
    right: 20px;
    top: 50%;
  }

  .monster {
    width: min(100px, 25vw);
    height: min(100px, 25vw);
    position: absolute;
    transition: all 0.5s;
    opacity: 0;
    z-index: 1;
  }

  .monster.close {
    transform: scale(1.5);
    filter: brightness(1.2);
  }

  .controls {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,0.9);
    padding: 15px;
    border-radius: 10px;
    display: none;
    font-size: min(16px, 4vw);
  }

  .lock-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 15px 30px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: min(16px, 4vw);
  }

  .monster-counter {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(255,255,255,0.9);
    padding: 15px;
    border-radius: 10px;
    font-size: min(16px, 4vw);
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }
</style>
</head>
<body>
  <div class="game-container">
    <div class="door locked">
      <div class="knob"></div>
    </div>
  </div>
  <div class="monster-counter">Monsters Found: <span id="count">0</span></div>
  <div class="controls">
    <h3>Parental Controls</h3>
    <label>
      Monster Speed:
      <input type="range" id="speed" min="1" max="5" value="3">
    </label>
    <br>
    <label>
      Difficulty:
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
  </div>
  <button class="lock-button">Hold to Access Controls</button>

<script>
const door = document.querySelector('.door');
const controls = document.querySelector('.controls');
const lockButton = document.querySelector('.lock-button');
const counter = document.querySelector('#count');
let monsterCount = 0;
let isLocked = true;
let controlsLocked = true;

const monsterTypes = [
  { color: '#2ecc71', eyes: 2 },
  { color: '#9b59b6', eyes: 1 },
  { color: '#f1c40f', eyes: 3 },
  { color: '#1abc9c', eyes: 2 }
];

function getDistance(x1, y1, x2, y2) {
  return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
}

function createMonster() {
  const monster = document.createElement('div');
  monster.className = 'monster';
  const type = monsterTypes[Math.floor(Math.random() * monsterTypes.length)];
  
  const svg = `
    <svg viewBox="0 0 100 100">
      <path d="M10,50 Q50,${Math.random() * 30 + 20} 90,50 Q50,${Math.random() * 30 + 60} 10,50" 
            fill="${type.color}">
        <animate attributeName="d" 
                 dur="1s" 
                 repeatCount="indefinite"
                 values="M10,50 Q50,${Math.random() * 30 + 20} 90,50 Q50,${Math.random() * 30 + 60} 10,50;
                         M10,50 Q50,${Math.random() * 30 + 25} 90,50 Q50,${Math.random() * 30 + 55} 10,50;
                         M10,50 Q50,${Math.random() * 30 + 20} 90,50 Q50,${Math.random() * 30 + 60} 10,50"/>
      </path>
      ${Array(type.eyes).fill().map((_, i) => `
        <circle cx="${25 + (i * 25)}" cy="45" r="5" fill="white">
          <animate attributeName="cy" 
                   dur="0.5s" 
                   repeatCount="indefinite"
                   values="45;43;45"/>
        </circle>
        <circle cx="${25 + (i * 25)}" cy="45" r="2" fill="black">
          <animate attributeName="cy" 
                   dur="0.5s" 
                   repeatCount="indefinite"
                   values="45;43;45"/>
        </circle>
      `).join('')}
    </svg>
  `;
  
  monster.innerHTML = svg;
  document.querySelector('.game-container').appendChild(monster);
  
  const moveMonster = () => {
    const speed = document.querySelector('#speed').value;
    const doorRect = door.getBoundingClientRect();
    const doorCenter = {
      x: doorRect.left + doorRect.width / 2,
      y: doorRect.top + doorRect.height / 2
    };
    
    const newX = Math.random() * (window.innerWidth - 100);
    const newY = Math.random() * (window.innerHeight - 100);
    monster.style.left = newX + 'px';
    monster.style.top = newY + 'px';
    monster.style.opacity = '1';
    
    const distance = getDistance(newX, newY, doorCenter.x, doorCenter.y);
    if (distance < 200) {
      monster.classList.add('close');
      monster.style.animation = 'bounce 0.5s infinite';
      // Auto-close door when monster is close
      door.classList.add('closed');
      setTimeout(() => {
        door.classList.remove('closed');
      }, 1000);
    } else {
      monster.classList.remove('close');
      monster.style.animation = 'wobble 2s infinite';
    }
    
    setTimeout(() => {
      monster.style.opacity = '0';
      setTimeout(() => monster.remove(), 500);
    }, 2000 / speed);
  };
  
  moveMonster();
}

// Touch and click events for door
const handleDoorInteraction = () => {
  if (!isLocked) {
    createMonster();
    monsterCount++;
    counter.textContent = monsterCount;
  } else {
    door.style.transform = 'translate(-50%, -50%) rotate(5deg)';
    setTimeout(() => {
      door.style.transform = 'translate(-50%, -50%) rotate(-5deg)';
      setTimeout(() => {
        door.style.transform = 'translate(-50%, -50%) rotate(0)';
      }, 100);
    }, 100);
  }
};

door.addEventListener('click', handleDoorInteraction);
door.addEventListener('touchend', (e) => {
  e.preventDefault();
  handleDoorInteraction();
});

// Hold/touch to unlock controls
let holdTimer;
const startHold = () => {
  holdTimer = setTimeout(() => {
    controlsLocked = !controlsLocked;
    controls.style.display = controlsLocked ? 'none' : 'block';
    lockButton.textContent = controlsLocked ? 'Hold to Access Controls' : 'Hold to Lock Controls';
  }, 2000);
};

const endHold = () => {
  clearTimeout(holdTimer);
};

lockButton.addEventListener('mousedown', startHold);
lockButton.addEventListener('touchstart', startHold);
lockButton.addEventListener('mouseup', endHold);
lockButton.addEventListener('touchend', endHold);
lockButton.addEventListener('mouseleave', endHold);
lockButton.addEventListener('touchcancel', endHold);

document.addEventListener('keydown', (e) => {
  if (e.key === 'l' && !controlsLocked) {
    isLocked = !isLocked;
    door.classList.toggle('locked');
  }
});

document.querySelector('#difficulty').addEventListener('change', (e) => {
  const speed = document.querySelector('#speed');
  switch(e.target.value) {
    case 'easy':
      speed.value = 2;
      break;
    case 'medium':
      speed.value = 3;
      break;
    case 'hard':
      speed.value = 5;
      break;
  }
});
</script>

</body></html>
